<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="css/bootstrap-custom.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Flex:opsz,wght@6..144,1..1000&amp;display=swap">
  </head>
  <body>
    <div class="container pt-3">
      <nav class="navbar bg-body-tertiary rounded-pill">
        <div class="container-fluid"><a class="font-monospace fw-bold navbar-brand" href="index.html">MyKEY</a>
          <ul class="navbar-nav flex-row gap-4">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#"> </a></li>
            <li class="nav-item"><a class="btn btn-primary" href="#" role="button">My Cart</a></li>
          </ul>
        </div>
      </nav>
    </div>
    <main>
      <section class="container p-4">
        <h1 class="fw-bold">Preorder</h1>
        <form>
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" type="text">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control" id="phone" type="text">
          </div>
          <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" id="address" type="text">
          </div>
          <div class="mb-3">
            <label class="form-label" for="PostalCode">Postal Code</label>
            <input class="form-control" id="PostalCode" type="text">
          </div>
          <button class="btn btn-primary w-100">Submit Pre Order</button>
        </form>
      </section>
    </main>
    <footer class="container footer">
      <p>&copy; 2026 <span class="font-monospace fw-bold">MyKEY</span>. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
